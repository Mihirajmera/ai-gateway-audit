[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gateway-audit"
version = "0.1.0"
description = "Audit AI gateway (LiteLLM) configuration against tier-0 controls, with hashed evidence and OSCAL output"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mihir Ajmera" }]
dependencies = ["pyyaml>=6.0,<7"]
keywords = ["ai-security", "ai-governance", "litellm", "ai-gateway", "grc", "oscal", "compliance", "owasp-llm-top-10"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
]

[project.urls]
Homepage = "https://github.com/Mihirajmera/ai-gateway-audit"
Issues = "https://github.com/Mihirajmera/ai-gateway-audit/issues"

[project.scripts]
ai-gateway-audit = "ai_gateway_audit.__main__:main"

[tool.setuptools]
packages = ["ai_gateway_audit"]

[tool.setuptools.package-data]
ai_gateway_audit = ["*.yaml", "examples/*/*"]
