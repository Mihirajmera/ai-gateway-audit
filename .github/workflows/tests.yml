name: Tests

on:
  push: {branches: [main]}
  pull_request: {}
  workflow_dispatch: {}

permissions: {contents: read}

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Wheel ships catalogs, examples and console script
        run: python scripts/check_wheel.py

      # Run the demo and check that the committed sample-output/ is exactly what this version produces.
      - name: Demo and sample output are current
        env:
          SOURCE_DATE_EPOCH: '1791763200'
        run: |
          python -m ai_gateway_audit demo --out sample-output
          git diff --exit-code sample-output/
          cat sample-output/gateway-audit.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-gateway-audit
          path: sample-output/
