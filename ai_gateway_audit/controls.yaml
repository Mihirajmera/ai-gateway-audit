# Control catalog. Each check is defined once and cross-walked to the frameworks it provides
# evidence for. Mappings are my own judgment; verify them against the official crosswalks
# before relying on them in an audit.
#
# Frameworks: NIST SP 800-53 Rev. 5, AICPA TSC 2017 (rev. 2022),
# OWASP Top 10 for LLM Applications 2025.
#
# needs: what the check reads. "config" needs a LiteLLM config.yaml; "deployment" needs a
# Compose file or .env describing how the gateway runs. Without it the check is NOT ASSESSED,
# never silently passed.

controls:
  GWA-01:
    title: Provider credentials are not stored in plain text
    needs: config
    nist_800_53: [IA-5(7), SC-28]
    soc2: [CC6.1]
    owasp_llm: [LLM02]

  GWA-02:
    title: The proxy requires a master key that is not stored in plain text
    needs: config
    nist_800_53: [AC-3, IA-2, IA-5(7)]
    soc2: [CC6.1]
    owasp_llm: [LLM10]

  GWA-03:
    title: Prompts and responses are kept out of logs
    needs: config
    nist_800_53: [AU-3(3), SI-12]
    soc2: [C1.1]
    owasp_llm: [LLM02]

  GWA-04:
    title: Provider keys are not held in the gateway database
    needs: config
    nist_800_53: [SC-12, SC-28]
    soc2: [CC6.1]
    owasp_llm: [LLM02]

  GWA-05:
    title: The admin UI does not accept a shared environment login
    needs: config
    nist_800_53: [AC-2, IA-2]
    soc2: [CC6.1, CC6.2]
    owasp_llm: []

  GWA-06:
    title: Spend is capped globally and per key
    needs: config
    nist_800_53: [SC-6]
    soc2: [A1.1]
    owasp_llm: [LLM10]

  GWA-07:
    title: The gateway image is pinned by digest
    needs: deployment
    nist_800_53: [CM-2, SI-7]
    soc2: [CC8.1]
    owasp_llm: [LLM03]

  GWA-08:
    title: TLS certificates are verified on calls to providers
    needs: config
    nist_800_53: [SC-8, SC-23]
    soc2: [CC6.7]
    owasp_llm: []

  GWA-09:
    title: Interactive API documentation is disabled
    needs: deployment
    nist_800_53: [CM-7]
    soc2: []
    owasp_llm: []

  GWA-10:
    title: Request and upload sizes are limited
    needs: config
    nist_800_53: [SC-5, CM-7]
    soc2: []
    owasp_llm: [LLM10]

# Controls a configuration file can't prove. Listed in every report so a reviewer knows what
# still needs evidence from somewhere else.
manual:
  - {id: M-01, title: "Outbound traffic from the gateway is limited to approved model providers", nist_800_53: [SC-7(5)]}
  - {id: M-02, title: "The admin UI and management routes are not reachable from the internet", nist_800_53: [AC-17, SC-7]}
  - {id: M-03, title: "Provider keys are rotated and their use is monitored", nist_800_53: [IA-5(1), AU-6]}
  - {id: M-04, title: "The gateway database is encrypted and access to it is restricted", nist_800_53: [SC-28, AC-6]}
